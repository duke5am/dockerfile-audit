[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dockerfile-audit"
version = "1.0.0"
description = "Static Dockerfile auditor: no daemon, no build, no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "duke5am" }]
keywords = ["docker", "dockerfile", "linter", "security", "hardening", "static-analysis"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
dockerfile-audit = "dockerfile_audit.cli:main"

[project.urls]
Homepage = "https://github.com/duke5am/dockerfile-hardening-lint"

[tool.setuptools]
packages = ["dockerfile_audit"]
